<svg xmlns="http://www.w3.org/2000/svg" width="680" height="700" viewBox="0 0 680 700" role="img" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Questions types des questionnaires d'assurance cyber selon la taille de l'entreprise</title>
<desc>Trois paliers d'entreprise, avec pour chacun les sujets abordés et la formulation des questions posées par les assureurs.</desc>
<style>
text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.h{font-size:14px;font-weight:500;fill:#2C2C2A}
.th{font-size:13px;font-weight:500}
.ts{font-size:12px;font-weight:400}
</style>
<text class="h" x="40" y="30">Socle TPE — moins de 10 salariés</text>
<rect x="40" y="46" width="600" height="150" rx="12" fill="#E6F1FB" stroke="#185FA5" stroke-width="0.5"/>
<text class="th" x="62" y="72" fill="#0C447C">Sujet</text>
<text class="th" x="220" y="72" fill="#0C447C">Formulation</text>
<text class="ts" x="62" y="98" fill="#185FA5">Sauvegardes</text>
<text class="ts" x="220" y="98" fill="#185FA5">Une copie est-elle déconnectée en permanence ?</text>
<text class="ts" x="62" y="122" fill="#185FA5">Restauration</text>
<text class="ts" x="220" y="122" fill="#185FA5">Quand avez-vous restauré pour la dernière fois ?</text>
<text class="ts" x="62" y="146" fill="#185FA5">Cloud</text>
<text class="ts" x="220" y="146" fill="#185FA5">Sauvegarde ou simple synchronisation de fichiers ?</text>
<text class="ts" x="62" y="170" fill="#185FA5">Messagerie</text>
<text class="ts" x="220" y="170" fill="#185FA5">Double authentification exigée sur le webmail ?</text>
<text class="ts" x="62" y="186" fill="#185FA5">Correctifs</text>
<text class="ts" x="220" y="186" fill="#185FA5">Sous quel délai appliquez-vous les mises à jour ?</text>
<text class="h" x="40" y="240">Palier PME — 10 à 50 salariés</text>
<rect x="40" y="256" width="600" height="174" rx="12" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text class="th" x="62" y="282" fill="#3C3489">Sujet</text>
<text class="th" x="220" y="282" fill="#3C3489">Formulation, en plus du socle</text>
<text class="ts" x="62" y="308" fill="#534AB7">Détection</text>
<text class="ts" x="220" y="308" fill="#534AB7">Quel outil, quel éditeur, sur quelle part du parc ?</text>
<text class="ts" x="62" y="332" fill="#534AB7">Administration</text>
<text class="ts" x="220" y="332" fill="#534AB7">Vos administrateurs ont-ils deux comptes distincts ?</text>
<text class="ts" x="62" y="356" fill="#534AB7">Départs</text>
<text class="ts" x="220" y="356" fill="#534AB7">Sous quel délai les accès sont-ils coupés ?</text>
<text class="ts" x="62" y="380" fill="#534AB7">Obsolescence</text>
<text class="ts" x="220" y="380" fill="#534AB7">Des systèmes ne sont-ils plus mis à jour par l'éditeur ?</text>
<text class="ts" x="62" y="404" fill="#534AB7">Sensibilisation</text>
<text class="ts" x="220" y="404" fill="#534AB7">Menez-vous des campagnes de faux courriels ?</text>
<text class="ts" x="62" y="420" fill="#534AB7">Continuité</text>
<text class="ts" x="220" y="420" fill="#534AB7">Le plan de reprise couvre-t-il le rançongiciel ?</text>
<text class="h" x="40" y="474">Palier PME+ — 50 salariés et plus</text>
<rect x="40" y="490" width="600" height="174" rx="12" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text class="th" x="62" y="516" fill="#712B13">Sujet</text>
<text class="th" x="220" y="516" fill="#712B13">Formulation, en plus des paliers précédents</text>
<text class="ts" x="62" y="542" fill="#993C1D">Privilèges</text>
<text class="ts" x="220" y="542" fill="#993C1D">Combien d'accès administrateur, et pourquoi ce nombre ?</text>
<text class="ts" x="62" y="566" fill="#993C1D">Journaux</text>
<text class="ts" x="220" y="566" fill="#993C1D">Conservés combien de temps, et stockés où ?</text>
<text class="ts" x="62" y="590" fill="#993C1D">Correctifs</text>
<text class="ts" x="220" y="590" fill="#993C1D">Quel taux de respect de vos délais sur douze mois ?</text>
<text class="ts" x="62" y="614" fill="#993C1D">Tests d'intrusion</text>
<text class="ts" x="220" y="614" fill="#993C1D">Sous quel délai corrigez-vous les constats ?</text>
<text class="ts" x="62" y="638" fill="#993C1D">Sauvegardes</text>
<text class="ts" x="220" y="638" fill="#993C1D">Protégées si l'attaquant est déjà présent depuis 45 jours ?</text>
<text class="ts" x="62" y="654" fill="#993C1D">Prestataires</text>
<text class="ts" x="220" y="654" fill="#993C1D">Quel recours si l'incident vient de leur fait ?</text>
</svg>
