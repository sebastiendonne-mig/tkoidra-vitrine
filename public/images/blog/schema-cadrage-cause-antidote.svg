<svg width="680" height="464" viewBox="0 0 680 464" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Causes d'échec des projets IA et antidotes au cadrage</title>
  <desc>Cinq causes racines d'échec des projets IA identifiées par l'étude RAND 2024, avec la vérification de cadrage qui permet de les éviter.</desc>

  <rect x="40" y="40" width="290" height="44" rx="8" fill="#0D1F40"/>
  <text x="185" y="62" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14" font-weight="700">Cause d'échec</text>
  <rect x="350" y="40" width="290" height="44" rx="8" fill="#00B4D8"/>
  <text x="495" y="62" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14" font-weight="700">Antidote au cadrage</text>

  <rect x="40" y="96" width="290" height="56" rx="8" fill="#0D1F40"/>
  <text x="185" y="124" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Problème mal formulé</text>
