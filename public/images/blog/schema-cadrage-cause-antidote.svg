  <text x="495" y="124" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Cadrer le problème avec la tech</text>

  <rect x="40" y="164" width="290" height="56" rx="8" fill="#0D1F40"/>
  <text x="185" y="192" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Course à la dernière techno</text>
  <rect x="350" y="164" width="290" height="56" rx="8" fill="#00B4D8"/>
  <text x="495" y="192" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Focus sur le problème métier</text>

  <rect x="40" y="232" width="290" height="56" rx="8" fill="#0D1F40"/>
  <text x="185" y="260" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Données pas prêtes</text>
  <rect x="350" y="232" width="290" height="56" rx="8" fill="#00B4D8"/>
  <text x="495" y="260" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Auditer les données en amont</text>

  <rect x="40" y="300" width="290" height="56" rx="8" fill="#0D1F40"/>
  <text x="185" y="328" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Infrastructure sous-investie</text>
  <rect x="350" y="300" width="290" height="56" rx="8" fill="#00B4D8"/>
  <text x="495" y="328" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Investir dans le déploiement tôt</text>

  <rect x="40" y="368" width="290" height="56" rx="8" fill="#0D1F40"/>
  <text x="185" y="396" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Problème hors de portée IA</text>
  <rect x="350" y="368" width="290" height="56" rx="8" fill="#00B4D8"/>
  <text x="495" y="396" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="13">Vérifier la faisabilité technique</text>
