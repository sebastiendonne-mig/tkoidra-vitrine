<svg width="680" height="428" viewBox="0 0 680 428" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Comparaison PO classique vs PO IA</title>
  <desc>Tableau comparant quatre dimensions du rôle entre un Product Owner classique et un Product Owner IA.</desc>

  <rect x="240" y="40" width="190" height="44" rx="8" fill="#0D1F40"/>
  <text x="335" y="62" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14" font-weight="700">PO classique</text>
  <rect x="440" y="40" width="190" height="44" rx="8" fill="#00B4D8"/>
  <text x="535" y="62" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14" font-weight="700">PO IA</text>

  <rect x="40" y="96" width="190" height="64" rx="8" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="1"/>
  <text x="135" y="122" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">Critères</text>
  <text x="135" y="140" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">d'acceptation</text>
  <rect x="240" y="96" width="190" height="64" rx="8" fill="#0D1F40"/>
  <text x="335" y="128" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Résultat prévisible</text>
  <rect x="440" y="96" width="190" height="64" rx="8" fill="#00B4D8"/>
  <text x="535" y="128" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Résultat incertain</text>

  <rect x="40" y="172" width="190" height="64" rx="8" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="1"/>
  <text x="135" y="198" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">Rythme de</text>
  <text x="135" y="216" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">la roadmap</text>
  <rect x="240" y="172" width="190" height="64" rx="8" fill="#0D1F40"/>
  <text x="335" y="204" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Roadmap figée</text>
  <rect x="440" y="172" width="190" height="64" rx="8" fill="#00B4D8"/>
  <text x="535" y="204" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Roadmap évolutive</text>

  <rect x="40" y="248" width="190" height="64" rx="8" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="1"/>
  <text x="135" y="274" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">Proximité</text>
  <text x="135" y="292" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">technique</text>
  <rect x="240" y="248" width="190" height="64" rx="8" fill="#0D1F40"/>
  <text x="335" y="280" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Dépend des devs</text>
  <rect x="440" y="248" width="190" height="64" rx="8" fill="#00B4D8"/>
  <text x="535" y="280" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Plus technique</text>

  <rect x="40" y="324" width="190" height="64" rx="8" fill="#F2F4F7" stroke="#D0D5DD" stroke-width="1"/>
  <text x="135" y="350" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">Qui porte</text>
  <text x="135" y="368" text-anchor="middle" dominant-baseline="middle" fill="#0D1F40" font-size="13">la décision</text>
  <rect x="240" y="324" width="190" height="64" rx="8" fill="#0D1F40"/>
  <text x="335" y="356" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Priorise le backlog</text>
  <rect x="440" y="324" width="190" height="64" rx="8" fill="#00B4D8"/>
  <text x="535" y="356" text-anchor="middle" dominant-baseline="middle" fill="#FFFFFF" font-size="14">Arbitre le risque IA</text>
</svg>
